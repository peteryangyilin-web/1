<!doctype html>
<html lang="en" class="go-entering">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="GO — Your training, nutrition and progress, in one clear view."
    />
    <title>GO — Every move matters.</title>
    <link rel="preload" as="image" href="/branding/go-loading-smooth-stay.gif" />
    <style>
      html.go-entering { overflow: hidden; }
      #go-intro { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; overflow: hidden; background: #fcfcfc; }
      .go-intro-center { display: grid; place-items: center; width: min(480px, 100vw); aspect-ratio: 6 / 5; }
      .go-intro-image, .go-intro-fallback { grid-area: 1 / 1; }
      .go-intro-image { display: block; width: 100%; height: auto; max-height: 80dvh; object-fit: contain; opacity: 0; }
      .go-intro-fallback { font-family: "Manrope Variable", sans-serif; font-size: 78px; font-weight: 800; color: var(--brand-green, #b6d532); }
      .go-intro-fallback span { color: #858585; }
      .go-intro-ready .go-intro-image { opacity: 1; }
      .go-intro-ready .go-intro-fallback { visibility: hidden; }
      .go-intro-skip { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); right: 28px; padding: 10px 16px; border: 1px solid #ddd; border-radius: 24px; background: #fff; color: #626862; font: 12px sans-serif; cursor: pointer; }
      .go-intro-skip:focus-visible { outline: 2px solid #187451; outline-offset: 4px; }
      .go-intro-leaving { animation: go-intro-out 220ms ease-out both; }
      @keyframes go-intro-out { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .go-intro-image { visibility: hidden; } .go-intro-leaving { animation: none; } }
    </style>
  </head>
  <body>
    <div id="go-intro" role="status" aria-label="Opening GO">
      <div class="go-intro-center" aria-hidden="true">
        <div class="go-intro-fallback">G<span>O</span></div>
        <img class="go-intro-image" src="/branding/go-loading-smooth-stay.gif" width="480" height="400" alt="" decoding="async" />
      </div>
      <button class="go-intro-skip" type="button">Skip intro</button>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
