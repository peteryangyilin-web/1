<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO · 数据库初始化</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8faf6;color:#36503d;font:15px/1.8 system-ui,sans-serif}main{max-width:780px;margin:48px auto;padding:0 24px 60px}.logo{font-size:36px;letter-spacing:-3px;font-weight:750;color:#b6d532;text-decoration:none}.logo span{color:#858585}h1{font-size:32px;letter-spacing:-1px;line-height:1.35;margin:30px 0 12px}p{color:#768475;margin:10px 0 24px}section{background:white;border:1px solid #dfe8da;border-radius:15px;padding:24px;margin:18px 0}h2{font-size:18px;margin:0 0 12px;font-weight:600}button,.primary{display:inline-block;padding:12px 22px;border:0;border-radius:8px;background:#315b3b;color:white;font:inherit;cursor:pointer;text-decoration:none;line-height:1.5}button:disabled{opacity:.5;cursor:wait}#copy-status{margin:12px 0 0;font-size:13px;color:#507448;min-height:24px}.hint{font-size:13px;color:#8a9584;margin:12px 0 0}code{font:13px/1.7 ui-monospace,monospace;background:#eff5e9;padding:6px 10px;border-radius:5px;display:inline-block}details{margin-top:20px}summary{font-size:13px;color:#7a8a73;cursor:pointer}textarea{width:100%;height:220px;resize:vertical;border:1px solid #dfe6d9;border-radius:8px;margin-top:12px;padding:12px;font:11px/1.6 ui-monospace,monospace;color:#5b6d53;background:#fbfcfa}a{color:#426f49}.error{color:#9a5037!important}@media(max-width:500px){main{margin-top:24px;padding:0 18px 40px}h1{font-size:27px}section{padding:21px}button,.primary{width:100%;text-align:center}}</style></head>
<body><main><a href="/" class="logo" aria-label="GO 首页">G<span>O</span></a><h1>初始化 GO 数据库</h1><p>只需复制、粘贴、运行。你不需要自己写代码。</p>
<section><h2>1. 复制初始化代码</h2><button id="copy" disabled>正在准备代码…</button><p id="copy-status" role="status" aria-live="polite"></p><details id="code-details"><summary>查看代码／手动复制</summary><textarea id="sql" readonly aria-label="数据库初始化 SQL" spellcheck="false"></textarea></details></section>
<section><h2>2. 在 Supabase 中运行</h2><a id="editor" class="primary" href="https://supabase.com/dashboard" target="_blank" rel="noreferrer">打开 Supabase SQL Editor ↗</a><p class="hint">在新的查询里粘贴刚才复制的代码，然后点击绿色 <strong>Run</strong> 按钮。</p></section>
<section><h2>3. 查看运行结果</h2><p>在 Supabase 的结果区域看到下面这句话，就是数据库初始化成功：</p><code>Success. No rows returned</code><p class="hint">完成后回到聊天告诉我“运行成功”。如果出现错误，把错误文字发给我，我帮你处理。</p></section>
<p class="hint">本页面只负责复制初始化代码，不会自动执行 SQL，也不会授予管理员权限。</p></main>
<script>
const copy=document.getElementById('copy'),status=document.getElementById('copy-status'),textarea=document.getElementById('sql');let sql='';
async function load(){try{const response=await fetch('/setup/go-accounts.sql',{cache:'no-store'});if(!response.ok)throw Error();sql=await response.text();textarea.value=sql;copy.disabled=false;copy.textContent='复制初始化代码';}catch{status.classList.add('error');status.textContent='代码暂时没有加载成功，请刷新页面再试。';}try{const response=await fetch('/setup/project.json',{cache:'no-store'});if(!response.ok)return;const project=await response.json();const host=new URL(project.projectUrl).hostname;const ref=host.split('.')[0];if(host.endsWith('.supabase.co')&&/^[a-z0-9]{20}$/.test(ref))document.getElementById('editor').href='https://supabase.com/dashboard/project/'+ref+'/sql/new';}catch{}}
copy.addEventListener('click',async()=>{let copied=false;try{await navigator.clipboard.writeText(sql);copied=true}catch{document.getElementById('code-details').open=true;textarea.focus();textarea.select();try{copied=document.execCommand('copy')}catch{}}status.textContent=copied?'代码已复制。下一步打开 Supabase，粘贴后点击 Run。':'代码已选中，请按 Ctrl+C（Mac 用 ⌘C）复制，再到 Supabase 粘贴并运行。';});
load();
</script></body></html>
