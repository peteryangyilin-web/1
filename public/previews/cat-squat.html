<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO · Cat squat preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#202720;font-family:system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}.preview{width:min(100%,560px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.logo{font-size:30px;font-weight:800;letter-spacing:-2px;text-decoration:none;color:#858585}.logo span{color:#b6d532}.tag{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#748071}h1{font-size:34px;letter-spacing:-1.4px;margin:0 0 8px}p{font-size:14px;color:#687466;line-height:1.6;margin:0 0 20px}video{display:block;width:100%;aspect-ratio:1;background:white;border-radius:24px;box-shadow:0 12px 50px #183d1a08}footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;font-size:12px;color:#687466}footer a{color:#315d45;text-underline-offset:4px}button{border:1px solid #dae1d6;background:white;border-radius:999px;padding:10px 20px;color:#315d45;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #315d45;outline-offset:4px}
</style>
</head>
<body>
<main class="preview">
<header><a class="logo" href="/" aria-label="GO home"><span>G</span>O</a><span class="tag">Squat preview · 60 fps</span></header>
<h1>A little stronger, one squat at a time.</h1><p>Your cat avatar, in motion. A first look at the training animation.</p>
<video id="squat" autoplay muted loop playsinline controls aria-label="Cat avatar demonstrating a repeating bodyweight squat"><source src="./cat-squat.mp4?v=2" type="video/mp4"></video>
<footer><button id="toggle" type="button">Pause animation</button><a href="./cat-squat.gif?v=2" download>Download GIF</a></footer>
</main>
<script>
const video=document.getElementById('squat'),button=document.getElementById('toggle');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){video.autoplay=false;video.pause()}
function sync(){button.textContent=video.paused?'Play animation':'Pause animation'}
video.addEventListener('play',sync);video.addEventListener('pause',sync);
button.addEventListener('click',()=>video.paused?video.play():video.pause());sync();
</script>
</body>
</html>
